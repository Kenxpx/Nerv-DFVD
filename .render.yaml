services:
  - type: web
    name: nerv-dfvd
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn detection_unit.wsgi
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: detection_unit.settings
      - key: SECRET_KEY
        value: your-production-secret-key
      - key: DEBUG
        value: False
